<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Simulasi JLPT</title>
<style>
:root{
  --bg:#fff; --card:#f6f6f6; --ink:#222; --muted:#777; --line:#e3e3e3;
  --primary:#7a52b8; --primary-ink:#fff; --soft:#efe9f8;
  --ok:#b7e4cc; --ok-ink:#17683e; --bad:#f6c4c4; --bad-ink:#9a2020;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16151a; --card:#232229; --ink:#eee; --muted:#9a98a3; --line:#33323a;
    --soft:#2b2538; --ok:#1f4d36; --ok-ink:#a8e8c6; --bad:#5a2626; --bad-ink:#f6b6b6;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .bar{display:flex;align-items:center;gap:8px;min-height:52px}
header h1{flex:1;margin:0;font-size:16px;text-align:center;font-weight:600}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--primary);color:var(--primary-ink)}
.btn.sm{padding:6px 12px;font-size:13px;background:var(--soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--ink);font-size:20px;padding:6px 10px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:12px;padding:16px;margin:16px 0}
.center{text-align:center}
.muted{color:var(--muted)}
.sec-row{padding:12px 0;border-top:1px solid var(--line);text-align:center}
.sec-row:first-of-type{border-top:0}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:18px}
.timer.low{color:#d33}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--line);display:flex;z-index:5}
.tabs button{flex:1;border:0;background:none;padding:14px 4px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 2px 0 var(--primary)}
main{padding-bottom:80px}
.inst,.passage,.qn{white-space:pre-line}
.qimg{max-width:100%;border:1px solid var(--line);border-radius:8px;margin:8px 0;display:block}
.inst{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:18px 0 8px;font-weight:600}
.passage{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 12px;line-height:1.9}
.qn{font-weight:600;margin:16px 0 6px;line-height:1.8}
.qn u{text-underline-offset:4px}
.opt{display:block;width:100%;text-align:left;border:2px solid transparent;background:var(--card);border-radius:8px;padding:12px 14px;margin:8px 0;font:inherit;color:inherit;cursor:pointer}
.opt.sel{border-color:var(--primary);background:var(--soft)}
.opt.ok{background:var(--ok);color:var(--ok-ink);border-color:var(--ok-ink)}
.opt.bad{background:var(--bad);color:var(--bad-ink);border-color:var(--bad-ink)}
.opt[disabled]{cursor:default}
.explain{background:var(--card);border-radius:8px;padding:10px 14px;font-size:14px;margin:6px 0}
.audio{position:sticky;top:53px;z-index:4;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.audio audio{flex:1;height:36px}
.cert{border:2px solid var(--primary);border-radius:12px;padding:16px;background:linear-gradient(180deg,#f7e8d6,#f7e8d6 55%,#c9b6e6);color:#222;position:relative;overflow:hidden}
.cert h2{margin:0;font-size:16px;text-align:center}
.cert table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;text-align:center}
.cert td,.cert th{border:1px solid #333;padding:8px 4px}
.cert .status{font-size:20px;font-weight:700;margin:14px 0 2px}
.cert .pass{color:#17683e}.cert .fail{color:#a22}
dialog{border:0;border-radius:12px;padding:20px;max-width:380px;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:#0008}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.list a{display:block;text-decoration:none;color:inherit}
</style>
</head>
<body>
<header><div class="wrap"><div class="bar" id="bar"></div></div></header>
<div class="wrap"><main id="app"></main></div>
<div class="tabs" id="tabs" hidden></div>
<dialog id="dlg"></dialog>

<script src="data.js"></script>
<script src="data2.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app'), bar = $('#bar'), tabs = $('#tabs'), dlg = $('#dlg');
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// teks soal boleh memuat <u>…</u>
const rich = s => esc(s).replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>');

let test, state, tick, curTab = 0;
const totalMin = t => t.sections.reduce((a,s)=>a+s.minutes,0);
const allQs = sec => sec.groups.flatMap(g=>g.questions);

function setBar(title, left, right){
  bar.innerHTML = `<span style="min-width:90px">${left||''}</span><h1>${title}</h1><span style="min-width:90px;text-align:right">${right||''}</span>`;
}
function home(){
  clearInterval(tick); tabs.hidden = true; stopAudio();
  const id = new URLSearchParams(location.search).get('test');
  if(id){ const t = TESTS.find(x=>x.id===id); if(t) return info(t); }
  if(TESTS.length===1) return info(TESTS[0], true);
  setBar('Simulasi JLPT');
  app.innerHTML = `<div class="list">` + TESTS.map(t=>`<a href="#" data-id="${t.id}"><div class="card"><b>${esc(t.title)}</b><div class="muted">${t.level} · ${totalMin(t)} menit</div></div></a>`).join('') + `</div>`;
  app.querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault(); info(TESTS.find(t=>t.id===a.dataset.id));});
}
function info(t, root){
  test = t; clearInterval(tick); tabs.hidden = true;
  const saved = store.get('exam:'+t.id), res = store.get('result:'+t.id);
  setBar(esc(t.title), root?'':'<button class="btn ghost" id="back">‹</button>');
  if(!root) $('#back').onclick = ()=>{ history.replaceState(null,'',location.pathname); home(); };
  app.innerHTML = `
    <div class="card center">
      <div><b>Waktu: ${totalMin(t)} menit</b></div>
      <div><b>Skor lulus: ${t.passScore}</b> <span class="muted">(dari 180)</span></div>
      <div style="margin-top:12px">${t.sections.map(s=>`<div class="sec-row">${esc(s.name)}: <b>${esc(s.jp)}</b> (${s.minutes}分)</div>`).join('')}</div>
    </div>
    <p class="muted center">Waktu terus berjalan walau halaman ditutup. Jawabanmu tersimpan otomatis di perangkat ini.</p>
    <button class="btn block" id="go">${saved?'Lanjutkan ujian':'Mulai ujian'}</button>
    ${res?`<button class="btn block" id="last" style="margin-top:10px;background:var(--soft);color:var(--primary)">Lihat hasil terakhir</button>`:''}`;
  $('#go').onclick = ()=> saved ? startExam(saved) : startExam(null);
  if(res) $('#last').onclick = ()=>{ state = res; showResult(); };
}
function startExam(saved){
  state = saved || { id:test.id, answers:{}, deadline: Date.now() + totalMin(test)*60000, name:'' };
  if(!saved){ store.set('exam:'+test.id, state); }
  curTab = 0; renderExam(); runTimer();
}
function key(si,gi,qi){ return si+'.'+gi+'.'+qi; }
function runTimer(){
  clearInterval(tick);
  const t = ()=>{
    const left = Math.max(0, Math.round((state.deadline-Date.now())/1000));
    const el = $('#timer'); if(!el) return;
    const h = String(Math.floor(left/3600)).padStart(2,'0'), m = String(Math.floor(left%3600/60)).padStart(2,'0'), s = String(left%60).padStart(2,'0');
    el.textContent = `${h}:${m}:${s}`; el.classList.toggle('low', left<300);
    if(left===0){ clearInterval(tick); submit(true); }
  };
  t(); tick = setInterval(t, 1000);
}
function renderExam(){
  setBar(`<span class="timer" id="timer"></span>`, '<button class="btn ghost" id="back">‹</button>', '<button class="btn sm" id="save">Menyimpan</button> <button class="btn sm" id="fin">Menyerahkan</button>');
  $('#back').onclick = ()=>confirmBox('Keluar sementara? Jawaban tersimpan dan waktu tetap berjalan.', 'Keluar', ()=>{clearInterval(tick); stopAudio(); home();});
  $('#save').onclick = ()=>{ store.set('exam:'+test.id, state); toast('Tersimpan'); };
  $('#fin').onclick = ()=>{
    const n = test.sections.reduce((a,s,si)=>a+allQs(s).length,0), done = Object.keys(state.answers).length;
    confirmBox(`Kamu menjawab ${done} dari ${n} soal. Serahkan sekarang?`, 'Serahkan', ()=>submit(false));
  };
  tabs.hidden = false;
  tabs.innerHTML = test.sections.map((s,i)=>`<button class="${i===curTab?'on':''}" data-i="${i}">${esc(s.name)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ stopAudio(); curTab=+b.dataset.i; renderExam(); runTimer(); window.scrollTo(0,0); });
  app.innerHTML = sectionHTML(test.sections[curTab], curTab, false);
  bindOptions();
  runTimer();
}
function sectionHTML(sec, si, review){
  let no = 0, html = '';
  sec.groups.forEach((g,gi)=>{
    html += `<div class="inst">${esc(g.instruction)}</div>`;
    if(g.audio) html += `<audio controls preload="none" src="${esc(g.audio)}" style="width:100%"></audio>`;
    if(g.img) html += `<img class="qimg" src="${esc(g.img)}" alt="">`;
    if(g.passage) html += `<div class="passage">${esc(g.passage)}</div>`;
    g.questions.forEach((q,qi)=>{
      no++;
      const k = key(si,gi,qi), picked = state.answers[k];
      html += `<div class="qn">${si+1}.${no} ${rich(q.q)}</div>`;
      if(q.img) html += `<img class="qimg" src="${esc(q.img)}" alt="">`;
      if(q.audio) html += `<audio controls preload="none" src="${esc(q.audio)}" style="width:100%"></audio>`;
      else if(sec.group==='li' && q.tts) html += `<button class="btn sm" data-tts="${esc(q.tts)}">▶ Putar</button>`;
      html += q.choices.map((c,ci)=>{
        let cls = 'opt';
        if(review){ if(ci===q.answer) cls+=' ok'; else if(ci===picked) cls+=' bad'; }
        else if(picked===ci) cls+=' sel';
        return `<button class="${cls}" data-k="${k}" data-c="${ci}" ${review?'disabled':''}>${ci+1}. ${rich(c)}</button>`;
      }).join('');
      if(review) html += `<div class="explain">${picked==null?'<b>Tidak dijawab.</b> ':''}${esc(q.explain||'')}</div>`;
    });
  });
  return html;
}
function audioBar(sec){ return `<span class="muted">🎧 Soal mendengarkan: tekan tombol ▶ di tiap soal.</span>`; }
function bindOptions(){
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k, c=+b.dataset.c;
    if(state.answers[k]===c) delete state.answers[k]; else state.answers[k]=c;
    store.set('exam:'+test.id, state);
    app.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x=>x.classList.toggle('sel', +x.dataset.c===state.answers[k]));
  });
  app.querySelectorAll('[data-tts]').forEach(b=>b.onclick=()=>speak(b.dataset.tts));
}
function speak(t){
  if(!('speechSynthesis' in window)) return toast('Browser tidak mendukung suara');
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang='ja-JP'; u.rate=.9; speechSynthesis.speak(u);
}
function stopAudio(){ try{ speechSynthesis.cancel(); }catch(e){} document.querySelectorAll('audio').forEach(a=>a.pause()); }

function score(){
  const per = test.sections.map((s,si)=>{
    let ok=0, n=0, pts=0, got=0;
    s.groups.forEach((g,gi)=>g.questions.forEach((q,qi)=>{
      const w = g.pts||1; n++; pts+=w;
      if(state.answers[key(si,gi,qi)]===q.answer){ ok++; got+=w; }
    }));
    return { name:s.name, group:s.group, ok, n, pts, got };
  });
  const g = grp => { const ps = per.filter(p=>p.group===grp); const t = ps.reduce((a,p)=>a+p.pts,0), got = ps.reduce((a,p)=>a+p.got,0); return t? got/t : 0; };
  const lk = Math.round(g('lk')*120), li = Math.round(g('li')*60), total = lk+li;
  const pass = total>=test.passScore && lk>=(test.minLK||0) && li>=(test.minLI||0);
  return { per, lk, li, total, pass };
}
function submit(auto){
  clearInterval(tick); stopAudio();
  state.score = score(); state.submittedAt = Date.now(); state.auto = !!auto;
  store.set('result:'+test.id, state); store.del('exam:'+test.id);
  showResult();
}
function showResult(){
  tabs.hidden = true; const r = state.score;
  const d = new Date(state.submittedAt||Date.now());
  setBar('Hasil', '<button class="btn ghost" id="back">‹</button>');
  $('#back').onclick = ()=>info(test);
  app.innerHTML = `
    <div class="card" style="padding:0;background:none"><div class="cert">
      <h2>日本語能力試験 ${r.pass?'合格':'不合格'} 結果通知書<br><span style="font-weight:500">Japanese-Language Proficiency Test — Test Result (Simulasi)</span></h2>
      <p style="margin:12px 0 0">受験日 Test Date: ${d.toLocaleDateString('id-ID',{dateStyle:'full'})}<br>受験レベル Level: <b>${esc(test.level)}</b><br>
      氏名 Name: <input id="nm" placeholder="Tulis namamu" value="${esc(state.name||'')}" style="border:0;border-bottom:1px solid #333;background:transparent;font:inherit;font-weight:700"></p>
      <table>
        <tr><th>言語知識・読解<br><small>Pengetahuan bahasa & Membaca</small></th><th>聴解<br><small>Mendengarkan</small></th><th>総合得点<br><small>Skor total</small></th></tr>
        <tr><td>${r.lk}/120</td><td>${r.li}/60</td><td><b>${r.total}/180</b></td></tr>
      </table>
      <div class="center"><div class="status ${r.pass?'pass':'fail'}">${r.pass?'合格 Lulus':'不合格 Belum lulus'}</div>
      <small>Skor lulus ${test.passScore} · minimum LK ${test.minLK} · minimum mendengarkan ${test.minLI}</small></div>
      <table style="margin-top:12px"><tr><th>Bagian</th><th>Benar</th></tr>${r.per.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.ok}/${p.n}</td></tr>`).join('')}</table>
    </div></div>
    ${state.auto?'<p class="muted center">Waktu habis — jawabanmu diserahkan otomatis.</p>':''}
    <button class="btn block" id="rv">Perlihatkan Jawaban</button>
    <button class="btn block" id="again" style="margin-top:10px;background:var(--soft);color:var(--primary)">Ulangi ujian</button>`;
  $('#nm').oninput = e=>{ state.name = e.target.value; store.set('result:'+test.id, state); };
  $('#rv').onclick = ()=>review(0);
  $('#again').onclick = ()=>confirmBox('Mulai ulang dari awal? Hasil lama akan terhapus.', 'Ulangi', ()=>{ store.del('result:'+test.id); store.del('exam:'+test.id); startExam(null); });
}
function review(i){
  curTab = i; setBar('Jawaban', '<button class="btn ghost" id="back">‹</button>');
  $('#back').onclick = showResult;
  tabs.hidden = false;
  tabs.innerHTML = test.sections.map((s,j)=>`<button class="${j===i?'on':''}" data-i="${j}">${esc(s.name)}</button>`).join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{ review(+b.dataset.i); window.scrollTo(0,0); });
  app.innerHTML = sectionHTML(test.sections[i], i, true);
}
function confirmBox(msg, okLabel, fn){
  dlg.innerHTML = `<p>${esc(msg)}</p><div class="row"><button class="btn sm" value="no">Batal</button><button class="btn" value="ok">${esc(okLabel)}</button></div>`;
  dlg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ dlg.close(); if(b.value==='ok') fn(); });
  dlg.showModal();
}
function toast(m){
  const t = document.createElement('div'); t.textContent = m;
  t.style.cssText='position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#333;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;z-index:20';
  document.body.appendChild(t); setTimeout(()=>t.remove(),1500);
}
document.addEventListener('play', e=>{ document.querySelectorAll('audio').forEach(a=>{ if(a!==e.target) a.pause(); }); }, true);
home();
</script>
</body>
</html>
